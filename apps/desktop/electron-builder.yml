# Windows installer: npm run dist → release/Tether-Setup-<version>.exe (unsigned, per-user, no admin).
appId: com.tether.desktop # = APP_ID in src/main/index.ts
productName: Tether
electronVersion: 45.1.0 # npm workspace hoisting: don't let it guess
directories:
  output: release
  buildResources: resources
files: # electron-vite bundles everything; no node_modules needed
  - out/**
  - package.json
extraResources: # real files for the OS (window, taskbar, toasts)
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/tray-on.png
    to: tray-on.png
  - from: resources/tray-off.png
    to: tray-off.png
  - from: resources/tether-icons.jar # the phone-side icon helper (helper/IconDump.java)
    to: tether-icons.jar
npmRebuild: false
win:
  target: nsis
  icon: resources/icon.ico
nsis: # branded wizard: resources/installer.nsh + installerSidebar/uninstallerSidebar/installerHeader.bmp (found by name)
  oneClick: false
  perMachine: false # %LOCALAPPDATA%\Programs\..., always per-user (installer.nsh skips the "only for me / anyone" page)
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  shortcutName: Tether
  artifactName: Tether-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false # %LOCALAPPDATA%\Tether (password, phones, engine) stays
