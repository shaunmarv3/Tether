# Windows installer: npm run dist → release/TETHER-Setup-<version>.exe (unsigned, per-user, no admin).
appId: com.tether.desktop # = APP_ID in src/main/index.ts
productName: TETHER
electronVersion: 45.1.0 # npm workspace hoisting: don't let it guess
directories:
  output: release
  buildResources: resources
files: # electron-vite bundles everything; no node_modules needed
  - out/**
  - package.json
extraResources: # real files for the OS (window, taskbar, toasts)
  - from: resources/icon.ico
    to: icon.ico
  - from: resources/tray-on.png
    to: tray-on.png
  - from: resources/tray-off.png
    to: tray-off.png
npmRebuild: false
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: true
  perMachine: false # %LOCALAPPDATA%\Programs\TETHER
  createDesktopShortcut: true
  shortcutName: TETHER
  artifactName: TETHER-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false # %LOCALAPPDATA%\Tether (password, phones, engine) stays
